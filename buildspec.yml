version: 0.2
phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin 763104351884.dkr.ecr.$AWS_REGION.amazonaws.com
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
  build:
    commands:
      - docker build -f sagemaker/Dockerfile --build-arg BASE_IMAGE=$BASE_IMAGE -t $IMAGE_URI .
  post_build:
    commands:
      - test "$CODEBUILD_BUILD_SUCCEEDING" = "1" && docker push $IMAGE_URI
